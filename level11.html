<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>delaun is awesome - level 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; text-align: center; }
  .clock {
    margin: 22px auto 18px;
    width: min(100%, 360px);
    border: 3px solid var(--ink); border-radius: 18px;
    background: #fff;
    padding: 18px 10px;
    font-weight: 800;
    font-size: clamp(3.6rem, 18vw, 5.6rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .clock.hidden { color: var(--muted); }
  .clock.win { background: var(--gold); }
  .big {
    font: inherit; font-weight: 800; font-size: 1.4rem;
    width: min(100%, 360px);
    padding: 16px;
    border: 3px solid var(--ink); border-radius: 14px;
    background: var(--gold); color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  .big.stop { background: var(--ink); color: var(--paper); }
  .msg { min-height: 30px; margin: 16px 0 4px; font-weight: 700; font-size: 1.15rem; }
  .tries { color: #4a453e; font-size: 0.95rem; min-height: 1.2em; }
  .wrap .next { position: static; transform: none; margin-top: 14px; }
  .hint { color: #4a453e; font-size: 0.9rem; margin-top: 10px; }
</style>
</head>
<body>
  <div class="topbar"><a href="index.html">delaun is awesome</a><span class="lvl">level 11</span></div>

  <div class="wrap">
    <h1>stop at 10</h1>
    <p class="sub">stop the clock at exactly 10.00. it disappears after 3 seconds. delaun can do it blindfolded</p>

    <div class="clock" id="clock">0.00</div>
    <button class="big" id="btn">start</button>
    <div class="hint">or press space</div>

    <div class="msg" id="msg"></div>
    <div class="tries" id="tries"></div>
    <button class="next" id="next" disabled onclick="location.href='level12.html'">next level</button>
  </div>

<script>
  const TARGET = 10, WINDOW = 0.30, HIDE_AFTER = 3;
  const clock = document.getElementById('clock');
  const btn = document.getElementById('btn');
  const msgEl = document.getElementById('msg');
  const triesEl = document.getElementById('tries');
  const next = document.getElementById('next');

  let running = false, start = 0, raf = 0, won = false, best = null, tries = 0;

  function loop() {
    const t = (performance.now() - start) / 1000;
    if (t < HIDE_AFTER) { clock.textContent = t.toFixed(2); clock.classList.remove('hidden'); }
    else { clock.textContent = '??.??'; clock.classList.add('hidden'); }
    raf = requestAnimationFrame(loop);
  }

  function press() {
    if (!running) {
      running = true;
      start = performance.now();
      clock.classList.remove('win');
      msgEl.textContent = '';
      btn.textContent = 'stop';
      btn.classList.add('stop');
      loop();
      return;
    }
    running = false;
    cancelAnimationFrame(raf);
    const t = (performance.now() - start) / 1000;
    const off = t - TARGET;
    tries++;
    clock.textContent = t.toFixed(2);
    clock.classList.remove('hidden');
    btn.classList.remove('stop');
    if (best === null || Math.abs(off) < Math.abs(best)) best = off;

    if (Math.abs(off) <= WINDOW) {
      won = true;
      clock.classList.add('win');
      msgEl.textContent = Math.abs(off) < 0.05 ? 'perfect. are you delaun?' : 'close enough. delaun approves';
      btn.textContent = 'again (for fun)';
      next.disabled = false;
      next.focus();
    } else {
      const a = Math.abs(off);
      msgEl.textContent = a < 1 ? `so close. ${a.toFixed(2)}s ${off < 0 ? 'early' : 'late'}`
                        : `way off. ${a.toFixed(2)}s ${off < 0 ? 'early' : 'late'}`;
      btn.textContent = 'try again';
    }
    triesEl.textContent = `tries: ${tries} · closest: ${Math.abs(best).toFixed(2)}s off`;
  }

  btn.addEventListener('click', press);
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    if (document.activeElement === next && !next.disabled) return;
    if (document.activeElement === btn) return; // the focused button's own click handles space
    e.preventDefault();
    press();
  });
</script>
</body>
</html>
