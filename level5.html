<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>delaun is awesome - level 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; text-align: center; }
  h1 { margin-top: 4px; font-size: clamp(1.8rem, 5vw, 2.6rem); }
  .sub { margin-bottom: 16px; }

  .hud { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .pip {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--ink); background: #fff;
    transition: background 0.2s, transform 0.2s;
  }
  .pip.on { background: var(--gold); transform: scale(1.12); }

  .game { position: relative; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; background: #6cc04a; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }

  .overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(244, 239, 230, 0.88);
    align-items: center; justify-content: center; flex-direction: column;
    padding: 16px;
  }
  .overlay b { font-size: clamp(2rem, 7vw, 3.4rem); font-weight: 800; }
  .overlay span { font-size: 1.1rem; margin-top: 6px; color: #4a453e; }

  .controls-hint { margin: 12px 0; color: #4a453e; }
  .controls-hint kbd {
    font: inherit; font-weight: 700; font-size: 0.85rem;
    border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 6px;
    padding: 1px 7px; background: #fff;
  }

  .pad { display: none; justify-content: space-between; align-items: center; margin: 14px 0; }
  .dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 5px; }
  .pad button {
    font: inherit; font-weight: 800; font-size: 1.1rem;
    border: 3px solid var(--ink); border-radius: 12px;
    background: #fff; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .pad .talk { width: 110px; height: 110px; border-radius: 50%; background: var(--gold); font-size: 1.2rem; }
  @media (pointer: coarse) { .pad { display: flex; } .controls-hint { display: none; } }

  .wrap .next { position: static; transform: none; margin-top: 6px; }
</style>
</head>
<body>
  <div class="topbar"><a href="index.html">delaun is awesome</a><span class="lvl">level 5</span></div>

  <div class="wrap">
    <h1>go tell delaun he's awesome</h1>
    <p class="sub">10 times. he keeps running off.</p>

    <div class="hud" id="hud"></div>

    <div class="game">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay"><b>he knows.</b><span>10/10. next level unlocked</span></div>
    </div>

    <p class="controls-hint">move <kbd>WASD</kbd> or <kbd>arrows</kbd> &nbsp; talk <kbd>space</kbd></p>

    <div class="pad">
      <div class="dpad">
        <span></span><button data-dir="up" aria-label="Up">↑</button><span></span>
        <button data-dir="left" aria-label="Left">←</button><span></span><button data-dir="right" aria-label="Right">→</button>
        <span></span><button data-dir="down" aria-label="Down">↓</button><span></span>
      </div>
      <button class="talk" id="talkBtn">talk</button>
    </div>

    <button class="next" id="next" disabled onclick="location.href='level6.html'">next level</button>
  </div>

<script>
  const GOAL = 10;
  const TILE = 48, COLS = 15, ROWS = 11;
  const W = COLS * TILE, H = ROWS * TILE;
  // # = border tree, T = tree, B = rock + bush, ~ = water, . = grass
  const MAP = [
    "###############",
    "#.....T.......#",
    "#.~~..T..TB...#",
    "#.~~.........B#",
    "#......BTT....#",
    "#..T..........#",
    "#..B...~~~..T.#",
    "#......~~~....#",
    "#.TB.......B..#",
    "#.......T.....#",
    "###############",
  ];

  const PRAISE = ["delaun ur awesome", "DELAUN IS AWESOME", "ur the goat fr", "best guy ever", "W delaun", "certified awesome", "delaun >>> everyone"];
  const REPLIES = ["i know", "facts", "say it louder", "obviously", "ty ty", "tell me something i don't know", "W", "real"];

  // ---------- Setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingQuality = 'high';

  const hud = document.getElementById('hud');
  for (let i = 0; i < GOAL; i++) { const p = document.createElement('div'); p.className = 'pip'; hud.appendChild(p); }
  const next = document.getElementById('next');

  const IMG = {};
  const loadImg = n => new Promise(res => { const i = new Image(); i.onload = () => res(); i.onerror = () => res(); i.src = `assets/${n}.png`; IMG[n] = i; });

  const player = { x: 1, y: 1, dx: TILE, dy: TILE, flip: false, moving: 0 };
  const delaun = { x: 10, y: 5, pop: 0 };
  let score = 0, cooldown = false, won = false;
  let bubbles = [];    // { who, text, start, until }
  let poofs = [];      // { x, y, t }

  const isWall = (x, y) => MAP[y][x] !== '.';
  const blocked = (x, y) => isWall(x, y) || (x === delaun.x && y === delaun.y);
  const adjacent = () => Math.abs(player.x - delaun.x) + Math.abs(player.y - delaun.y) === 1;

  function say(who, text, delay, ms) {
    const now = performance.now();
    bubbles = bubbles.filter(b => b.who !== who);
    bubbles.push({ who, text, start: now + delay, until: now + delay + ms });
  }

  // ---------- Game logic ----------
  function tryMove(dir) {
    if (won) return;
    const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir];
    if (d[0]) player.flip = d[0] < 0;
    const nx = player.x + d[0], ny = player.y + d[1];
    if (!blocked(nx, ny)) { player.x = nx; player.y = ny; player.moving = performance.now(); }
  }

  function relocateDelaun() {
    const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
    const q = [[player.x, player.y]];
    dist[player.y][player.x] = 0;
    while (q.length) {
      const [x, y] = q.shift();
      for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + ax, ny = y + ay;
        if (!isWall(nx, ny) && dist[ny][nx] < 0) { dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); }
      }
    }
    let options = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
      if (dist[y][x] >= 4 && dist[y][x] <= 10 && !(x === delaun.x && y === delaun.y)) options.push([x, y]);
    if (!options.length)
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (dist[y][x] > 1) options.push([x, y]);
    const [x, y] = options[Math.floor(Math.random() * options.length)];
    poofs.push({ x: delaun.x, y: delaun.y, t: performance.now() });
    delaun.x = x; delaun.y = y;
    poofs.push({ x, y, t: performance.now() });
  }

  function talk() {
    if (won || cooldown) return;
    if (!adjacent()) { say('player', "where'd he go", 0, 900); return; }
    cooldown = true;
    score++;
    hud.children[score - 1].classList.add('on');
    delaun.pop = performance.now();
    say('player', PRAISE[Math.floor(Math.random() * PRAISE.length)], 0, 1300);

    if (score >= GOAL) {
      won = true;
      say('delaun', "ok ok i get it", 400, 99999);
      setTimeout(() => {
        document.getElementById('overlay').style.display = 'flex';
        next.disabled = false;
        next.focus();
      }, 1600);
      return;
    }
    say('delaun', REPLIES[Math.floor(Math.random() * REPLIES.length)], 400, 900);
    setTimeout(() => { relocateDelaun(); cooldown = false; }, 1350);
  }

  // ---------- Input ----------
  const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  let held = null, holdTimer = null;
  function startHold(dir) {
    if (held === dir) return;
    stopHold();
    held = dir; tryMove(dir);
    holdTimer = setInterval(() => tryMove(dir), 135);
  }
  function stopHold(dir) { if (dir && dir !== held) return; clearInterval(holdTimer); held = null; }

  window.addEventListener('keydown', e => {
    if (KEYS[e.code]) { e.preventDefault(); if (!e.repeat) startHold(KEYS[e.code]); }
    else if (e.code === 'Space' || e.code === 'KeyE') {
      if (document.activeElement === next && !next.disabled) return;
      e.preventDefault(); if (!e.repeat) talk();
    }
  });
  window.addEventListener('keyup', e => { if (KEYS[e.code]) stopHold(KEYS[e.code]); });
  window.addEventListener('blur', () => stopHold());
  document.querySelectorAll('.dpad button').forEach(b => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); startHold(b.dataset.dir); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => stopHold(b.dataset.dir)));
  });
  document.getElementById('talkBtn').addEventListener('pointerdown', e => { e.preventDefault(); talk(); });

  // ---------- Drawing ----------
  let ground;   // pre-rendered grass + water layer
  function buildGround() {
    ground = document.createElement('canvas');
    ground.width = W * dpr; ground.height = H * dpr;
    const g = ground.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pat = (img, size) => {
      const c = document.createElement('canvas'); c.width = c.height = size * dpr;
      c.getContext('2d').drawImage(img, -1, -1, size * dpr + 2, size * dpr + 2); // overdraw 1px so edges don't blur into seams
      const p = g.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().scale(1 / dpr)); return p;
    };
    g.fillStyle = IMG.grass.complete && IMG.grass.naturalWidth ? pat(IMG.grass, 120) : '#6cc04a';
    g.fillRect(0, 0, W, H);
    const water = (x, y) => MAP[y] && MAP[y][x] === '~';
    g.fillStyle = IMG.water.complete && IMG.water.naturalWidth ? pat(IMG.water, 96) : '#1aa3f5';
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (water(x, y)) g.fillRect(x * TILE, y * TILE, TILE, TILE);
    // thick outline around ponds
    g.strokeStyle = '#1b1b1b'; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!water(x, y)) continue;
      const px = x * TILE, py = y * TILE;
      if (!water(x, y - 1)) { g.moveTo(px, py); g.lineTo(px + TILE, py); }
      if (!water(x, y + 1)) { g.moveTo(px, py + TILE); g.lineTo(px + TILE, py + TILE); }
      if (!water(x - 1, y)) { g.moveTo(px, py); g.lineTo(px, py + TILE); }
      if (!water(x + 1, y)) { g.moveTo(px + TILE, py); g.lineTo(px + TILE, py + TILE); }
    }
    g.stroke();
  }

  // static scenery, sorted by depth together with the characters each frame
  const scenery = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = MAP[y][x];
    if (t === '#' || t === 'T') scenery.push({ kind: 'tree', x, y });
    else if (t === 'B') scenery.push({ kind: 'bush', x, y });
  }

  function drawSprite(img, cx, feetY, h, flip = false, sx = 1, sy = 1) {
    if (!img.naturalWidth) return;
    const w = img.naturalWidth * h / img.naturalHeight;
    ctx.save();
    ctx.translate(cx, feetY);
    ctx.scale((flip ? -1 : 1) * sx, sy);
    ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
  }

  function shadow(cx, feetY, rx) {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(cx, feetY - 2, rx, rx * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Speech bubbles: measured, then placed so they never overlap each other
  const FONT = '700 17px Rubik, sans-serif';
  function layoutBubble(b, anchorX, headY, feetY, taken) {
    ctx.font = FONT;
    const w = Math.ceil(ctx.measureText(b.text).width) + 28, h = 40;
    const x = Math.max(6, Math.min(W - w - 6, anchorX - w / 2));
    const candidates = [headY - h - 14];
    taken.forEach(r => candidates.push(r.y - h - 8));   // stack above the other bubble
    candidates.push(feetY + 12);                          // or under the character
    taken.forEach(r => candidates.push(r.y + r.h + 8));  // or under the other bubble
    for (const y of candidates) {
      if (y < 6 || y + h > H - 6) continue;
      const r = { x, y, w, h };
      if (!taken.some(o => r.x < o.x + o.w + 6 && o.x < r.x + r.w + 6 && r.y < o.y + o.h + 6 && o.y < r.y + r.h + 6))
        return { ...r, text: b.text, anchorX, headY, feetY };
    }
    return { x, y: Math.max(6, headY - h - 14), w, h, text: b.text, anchorX, headY, feetY };
  }

  function drawBubble(r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 3; ctx.strokeStyle = '#1b1b1b'; ctx.fillStyle = '#fff';
    const above = r.y + r.h <= r.headY;
    // tail
    const tx = Math.max(r.x + 16, Math.min(r.x + r.w - 16, r.anchorX));
    const gap = above ? r.headY - (r.y + r.h) : r.y - r.feetY;
    if (gap < 40) {
      ctx.beginPath();
      if (above) { ctx.moveTo(tx - 8, r.y + r.h - 2); ctx.lineTo(r.anchorX, r.y + r.h + 11); ctx.lineTo(tx + 8, r.y + r.h - 2); }
      else { ctx.moveTo(tx - 8, r.y + 2); ctx.lineTo(r.anchorX, r.y - 11); ctx.lineTo(tx + 8, r.y + 2); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill(); ctx.stroke();
    // cover the tail seam
    if (gap < 40) { ctx.fillRect(tx - 6, above ? r.y + r.h - 4 : r.y + 1, 12, 3); }
    ctx.fillStyle = '#1b1b1b'; ctx.font = FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillText(r.text, r.x + 14, r.y + r.h / 2 + 1);
    ctx.restore();
  }

  function drawHint(cx, headY, now) {
    const label = matchMedia('(pointer: coarse)').matches ? 'talk' : 'space';
    ctx.font = '700 14px Rubik, sans-serif';
    const w = ctx.measureText(label).width + 18, h = 26;
    const y = headY - h - 10 + Math.sin(now / 200) * 2;
    ctx.fillStyle = '#f5b700'; ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(cx - w / 2, y, w, h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1b1b1b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, y + h / 2 + 1);
  }

  const CHAR_H = 70;
  function frame(now) {
    player.dx += (player.x * TILE - player.dx) * 0.3;
    player.dy += (player.y * TILE - player.dy) * 0.3;

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(ground, 0, 0, W, H);

    const pCx = player.dx + TILE / 2, pFeet = player.dy + TILE - 4;
    const dCx = delaun.x * TILE + TILE / 2, dFeet = delaun.y * TILE + TILE - 4;

    const items = scenery.map(s => ({
      depth: s.y * TILE + TILE,
      draw: () => s.kind === 'tree'
        ? drawSprite(IMG.tree, s.x * TILE + TILE / 2, s.y * TILE + TILE + 2, 66)
        : drawSprite(IMG.bush, s.x * TILE + TILE / 2, s.y * TILE + TILE - 4, 36),
    }));
    const walking = now - player.moving < 140;
    items.push({ depth: pFeet + 6, draw: () => {
      shadow(pCx, pFeet, 16);
      drawSprite(IMG.player, pCx, pFeet - (walking ? 3 : 0), CHAR_H, player.flip);
    }});
    const popT = Math.max(0, 1 - (now - delaun.pop) / 250);
    const bob = won ? Math.abs(Math.sin(now / 160)) * 8 : Math.sin(now / 350) * 1.5;
    items.push({ depth: dFeet + 6, draw: () => {
      shadow(dCx, dFeet, 14);
      drawSprite(IMG.delaun, dCx, dFeet - Math.max(0, bob), CHAR_H, false, 1 + popT * 0.15, 1 + popT * 0.15);
    }});
    items.sort((a, b) => a.depth - b.depth).forEach(i => i.draw());

    // poof effect
    poofs = poofs.filter(p => now - p.t < 450);
    for (const p of poofs) {
      const k = (now - p.t) / 450;
      ctx.strokeStyle = `rgba(27,27,27,${1 - k})`; ctx.lineWidth = 3;
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2, r1 = 10 + k * 22, r2 = r1 + 8;
        const cx = p.x * TILE + TILE / 2, cy = p.y * TILE + TILE / 2 - 10;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
      }
    }

    // speech bubbles (player first, then delaun placed around it)
    bubbles = bubbles.filter(b => b.until > now);
    const live = bubbles.filter(b => b.start <= now).sort((a, b) => (a.who === 'player' ? -1 : 1));
    const placed = [];
    for (const b of live) {
      const r = b.who === 'player'
        ? layoutBubble(b, pCx, pFeet - CHAR_H, pFeet, placed)
        : layoutBubble(b, dCx, dFeet - CHAR_H, dFeet, placed);
      placed.push(r);
      const fade = Math.min(1, (b.until - now) / 150, (now - b.start) / 100);
      drawBubble(r, Math.max(0, fade));
    }
    if (!live.length && adjacent() && !cooldown && !won) drawHint(dCx, dFeet - CHAR_H, now);

    requestAnimationFrame(frame);
  }

  Promise.all([
    ...['delaun', 'player', 'tree', 'bush', 'grass', 'water'].map(loadImg),
    document.fonts ? document.fonts.load('700 17px Rubik').catch(() => {}) : null,
  ]).then(() => { buildGround(); requestAnimationFrame(frame); });
</script>
</body>
</html>
