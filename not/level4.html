<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>delaun is not awesome - level 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>:root { --gold: #b48cff; }</style>
<style>
  html, body { height: 100%; overflow: hidden; }
  header { text-align: center; padding: 8px 16px 0; position: relative; z-index: 1; pointer-events: none; }
  .counter { font-weight: 800; font-size: 2.6rem; margin-top: 14px; }
  .counter span { color: var(--gold); -webkit-text-stroke: 2px var(--ink); }

  .crown {
    position: absolute;
    width: 88px; height: 88px;
    padding: 0; border: none; background: none;
    cursor: pointer;
    animation: spin 1.1s linear infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .crown svg { width: 100%; height: 100%; display: block; }
  .crown:focus-visible { outline: 3px dashed var(--ink); border-radius: 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .plus {
    position: absolute;
    font-weight: 800; font-size: 1.6rem;
    pointer-events: none;
    animation: rise 0.7s ease-out forwards;
  }
  @keyframes rise { to { transform: translateY(-48px); opacity: 0; } }

  .win {
    display: none;
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    width: calc(100% - 32px);
    text-align: center;
    font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.6rem);
  }
  .win small { display: block; font-weight: 400; font-size: 1.05rem; margin-top: 6px; color: #4a453e; }
</style>
</head>
<body>
  <div class="topbar"><a href="index.html">delaun is not awesome</a><span class="lvl">level 4</span></div>
  <header>
    <h1>steal the crown</h1>
    <p class="sub">it's delaun's. take it anyway. 4 times.</p>
    <div class="counter"><span id="count">0</span>/4</div>
  </header>

  <button class="crown" id="crown" aria-label="Crown">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M14 72 L8 30 L32 50 L50 18 L68 50 L92 30 L86 72 Z" fill="#f5b700" stroke="#1b1b1b" stroke-width="6" stroke-linejoin="round"/>
      <rect x="14" y="70" width="72" height="14" rx="3" fill="#f5b700" stroke="#1b1b1b" stroke-width="6"/>
      <circle cx="50" cy="56" r="6" fill="#ff5a36" stroke="#1b1b1b" stroke-width="4"/>
      <circle cx="28" cy="62" r="4" fill="#4da3ff" stroke="#1b1b1b" stroke-width="3"/>
      <circle cx="72" cy="62" r="4" fill="#4da3ff" stroke="#1b1b1b" stroke-width="3"/>
    </svg>
  </button>

  <div class="win" id="win">delaun's crown is gone<small>(delaun is not happy about this)</small></div>

  <button class="next" id="next" disabled onclick="location.href='level5.html'">next level</button>

<script>
  const GOAL = 4;
  const crown = document.getElementById('crown');
  const countEl = document.getElementById('count');
  const next = document.getElementById('next');
  let count = 0;

  function moveCrown() {
    const size = 88;
    const top = document.querySelector('header').getBoundingClientRect().bottom + 10;
    const bottom = window.innerHeight - 90 - size;
    const maxX = Math.max(0, window.innerWidth - size);
    const minY = Math.min(top, bottom);
    const oldX = parseFloat(crown.style.left) || -999;
    const oldY = parseFloat(crown.style.top) || -999;
    let x, y;
    for (let i = 0; i < 20; i++) {
      x = Math.random() * maxX;
      y = minY + Math.random() * Math.max(0, bottom - minY);
      if (Math.hypot(x - oldX, y - oldY) > 160) break;
    }
    crown.style.left = x + 'px';
    crown.style.top = y + 'px';
  }

  crown.addEventListener('click', () => {
    if (count >= GOAL) return;
    count++;
    countEl.textContent = count;
    const r = crown.getBoundingClientRect();
    const p = document.createElement('div');
    p.className = 'plus';
    p.textContent = '+1';
    p.style.left = (r.left + 28) + 'px';
    p.style.top = r.top + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);

    if (count >= GOAL) {
      crown.style.display = 'none';
      document.getElementById('win').style.display = 'block';
      next.disabled = false;
      next.focus();
    } else {
      moveCrown();
    }
  });

  window.addEventListener('resize', () => { if (count < GOAL) moveCrown(); });
  moveCrown();
</script>
<script src="../admin.js"></script>
</body>
</html>
