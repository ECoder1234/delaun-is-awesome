<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>delaun is not awesome - level 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>:root { --gold: #b48cff; }</style>
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; text-align: center; }
  h1 { margin-top: 4px; }

  .stats { display: flex; justify-content: center; gap: 36px; margin: 14px 0; }
  .stat b { display: block; font-weight: 800; font-size: 2rem; line-height: 1; }
  .stat small { color: #4a453e; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(100%, 420px); margin: 0 auto; }
  .hole {
    position: relative;
    aspect-ratio: 1;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: var(--soft);
    overflow: hidden;
  }
  .hole::before {
    content: '';
    position: absolute;
    left: 12%; right: 12%; bottom: 7%;
    height: 20%;
    background: #3a332b;
    border: 3px solid var(--ink);
    border-radius: 50%;
    z-index: 0;
  }
  .mole {
    position: absolute;
    left: 8%; right: 8%; bottom: 13%;
    height: 80%;
    padding: 0; border: none; background: none;
    cursor: pointer;
    transform: translateY(125%);
    transition: transform 0.12s ease-out;
    z-index: 1;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .mole.up { transform: translateY(0); }
  .mole img {
    width: 100%; height: 100%;
    object-fit: contain; object-position: bottom;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
    transition: transform 0.1s;
    transform-origin: bottom;
  }
  .mole.hit img { transform: scaleY(0.55) scaleX(1.15); }

  .pop {
    position: absolute; left: 0; right: 0; top: 4%;
    font-weight: 800; font-size: 1.4rem;
    z-index: 2; pointer-events: none;
    animation: rise 0.6s ease-out forwards;
  }
  .pop.bad { color: #ff5a36; }
  @keyframes rise { to { transform: translateY(-30px); opacity: 0; } }

  .msg { min-height: 28px; margin: 14px 0 8px; font-weight: 700; font-size: 1.1rem; }
  .start {
    font: inherit; font-weight: 700; font-size: 1.05rem;
    padding: 10px 24px; margin-bottom: 12px;
    border: 3px solid var(--ink); border-radius: 12px;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  .wrap .next { position: static; transform: none; margin-top: 4px; }
</style>
</head>
<body>
  <div class="topbar"><a href="index.html">delaun is not awesome</a><span class="lvl">level 20</span></div>

  <div class="wrap">
    <h1>whack a fan</h1>
    <p class="sub">bonk 15 delaun fans in 40 seconds. don't bonk delaun, that's too far.</p>

    <div class="stats">
      <div class="stat"><b id="score">0</b><small>of 15</small></div>
      <div class="stat"><b id="time">40</b><small>seconds</small></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="msg" id="msg"></div>
    <button class="start" id="start">start</button>
    <br>
    <button class="next" id="next" disabled onclick="location.href='level21.html'">next level</button>
  </div>

<script>
  const GOAL = 15, TIME = 40;
  const FALLBACK = 'data:image/svg+xml,' + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
    "<ellipse cx='50' cy='60' rx='38' ry='34' fill='#8f86a8' stroke='#1b1b1b' stroke-width='6'/>" +
    "<path d='M28 42 L44 50 M72 42 L56 50' stroke='#1b1b1b' stroke-width='6' stroke-linecap='round'/>" +
    "<circle cx='40' cy='58' r='4.5' fill='#1b1b1b'/><circle cx='60' cy='58' r='4.5' fill='#1b1b1b'/>" +
    "<path d='M38 78 Q50 70 62 78' fill='none' stroke='#1b1b1b' stroke-width='5' stroke-linecap='round'/></svg>");
  let haterSrc = FALLBACK;
  const probe = new Image();
  probe.onload = () => {
    haterSrc = '../assets/player.png';
    holes.forEach(h => { if (h.kind === 'hater') h.img.src = haterSrc; });
  };
  probe.src = '../assets/player.png';

  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('start');
  const next = document.getElementById('next');

  const holes = [];
  for (let i = 0; i < 9; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    const btn = document.createElement('button');
    btn.className = 'mole';
    btn.tabIndex = -1;
    const img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    btn.appendChild(img);
    hole.appendChild(btn);
    grid.appendChild(hole);
    const h = { hole, btn, img, up: false, hit: false, kind: null, timer: null };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); bonk(h); });
    holes.push(h);
  }

  let running = false, score = 0, endAt = 0, spawnTimer = null, tickTimer = null;

  function hide(h) {
    clearTimeout(h.timer);
    h.up = false;
    h.btn.classList.remove('up', 'hit');
  }

  function spawn() {
    if (!running) return;
    const free = holes.filter(h => !h.up);
    const upCount = holes.length - free.length;
    if (free.length && upCount < 3) {
      const h = free[Math.floor(Math.random() * free.length)];
      h.kind = Math.random() < 0.2 ? 'delaun' : 'hater';
      h.img.src = h.kind === 'delaun' ? '../assets/delaun.png' : haterSrc;
      h.btn.setAttribute('aria-label', h.kind);
      h.up = true; h.hit = false;
      h.btn.classList.add('up');
      h.timer = setTimeout(() => hide(h), h.kind === 'delaun' ? 1000 : 820);
    }
    spawnTimer = setTimeout(spawn, 380 + Math.random() * 380);
  }

  function popText(h, text, bad) {
    const p = document.createElement('div');
    p.className = 'pop' + (bad ? ' bad' : '');
    p.textContent = text;
    h.hole.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }

  function bonk(h) {
    if (!running || !h.up || h.hit) return;
    h.hit = true;
    h.btn.classList.add('hit');
    clearTimeout(h.timer);
    h.timer = setTimeout(() => hide(h), 180);
    if (h.kind === 'hater') {
      score++;
      popText(h, 'bonk', false);
      msgEl.textContent = '';
    } else {
      score = Math.max(0, score - 3);
      popText(h, '-3', true);
      msgEl.textContent = 'why would you do that';
    }
    scoreEl.textContent = score;
    if (score >= GOAL) win();
  }

  function tick() {
    const left = Math.max(0, (endAt - performance.now()) / 1000);
    timeEl.textContent = Math.ceil(left);
    if (left <= 0) lose();
  }

  function stop() {
    running = false;
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    holes.forEach(hide);
  }

  function start() {
    stop();
    score = 0;
    scoreEl.textContent = 0;
    timeEl.textContent = TIME;
    msgEl.textContent = '';
    startBtn.style.display = 'none';
    running = true;
    endAt = performance.now() + TIME * 1000;
    tickTimer = setInterval(tick, 100);
    spawn();
  }

  function win() {
    stop();
    msgEl.textContent = '15 fans bonked. delaun has nobody left';
    next.disabled = false;
    next.focus();
  }

  function lose() {
    stop();
    msgEl.textContent = "time's up. the fans won this round";
    startBtn.textContent = 'try again';
    startBtn.style.display = 'inline-block';
  }

  startBtn.addEventListener('click', start);
</script>
<script src="../admin.js"></script>
</body>
</html>
